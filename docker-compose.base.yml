services:
  postgres:
    image: postgres:16-alpine
    container_name: grund-postgres
    environment:
      POSTGRES_DB: grund
      POSTGRES_USER: grund
      POSTGRES_PASSWORD: grund_db_2024
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./packages/core/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - grund-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grund"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: grund-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - grund-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:

networks:
  grund-network:
    driver: bridge
