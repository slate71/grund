services:
  heartbeat-agent:
    build:
      context: .
      dockerfile: packages/agents/heartbeat/Dockerfile
    container_name: grund-heartbeat
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://grund:grund_db_2024@postgres:5432/grund
      REDIS_URL: redis://redis:6379
      PORT: 3001
      AGENT_NAME: heartbeat
      HEARTBEAT_RETENTION_DAYS: 30 # Keep last 30 days of heartbeats
    ports:
      - '3001:3001'
    networks:
      - grund-network
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3001/health']
      interval: 30s
      timeout: 10s
      retries: 3

  credential-proxy:
    build: ./infra/credential-proxy
    container_name: grund-credential-proxy
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      PORT: 9876
    volumes:
      - ~/.config/grund:/config
    ports:
      - '9876:9876'
    networks:
      - grund-network
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9876/health']
      interval: 30s
      timeout: 10s
      retries: 3

  email-triage-agent:
    build:
      context: .
      dockerfile: packages/agents/email-triage/Dockerfile
    container_name: grund-email-triage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      credential-proxy:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://grund:grund_db_2024@postgres:5432/grund
      REDIS_URL: redis://redis:6379
      CREDENTIAL_PROXY_URL: http://credential-proxy:9876
      ANTHROPIC_BASE_URL: http://credential-proxy:9876/anthropic
      ANTHROPIC_API_KEY: placeholder
      GMAIL_ACCOUNTS: ${GMAIL_ACCOUNTS:-default}
      GMAIL_NOTIFICATION_MODE: ${GMAIL_NOTIFICATION_MODE:-poll}
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}
      PUBSUB_SUBSCRIPTION: ${PUBSUB_SUBSCRIPTION:-gmail-notifications-pull}
      PUBSUB_TOPIC: ${PUBSUB_TOPIC:-}
      GOOGLE_APPLICATION_CREDENTIALS: /config/pubsub-sa-key.json
      PORT: 3003
    volumes:
      - ~/.config/grund:/config:ro
    ports:
      - '3003:3003'
    networks:
      - grund-network
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3003/health']
      interval: 30s
      timeout: 10s
      retries: 3

  finance-agent:
    build:
      context: .
      dockerfile: packages/agents/finance/Dockerfile
    container_name: grund-finance
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      credential-proxy:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://grund:grund_db_2024@postgres:5432/grund
      REDIS_URL: redis://redis:6379
      CREDENTIAL_PROXY_URL: http://credential-proxy:9876
      ANTHROPIC_BASE_URL: http://credential-proxy:9876/anthropic
      ANTHROPIC_API_KEY: placeholder
      PORT: 3004
    ports:
      - '3004:3004'
    networks:
      - grund-network
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3004/health']
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  grund-network:
    external: false
